[project]
name = "ds295r_katie"
version = "0.1.0"
description = "A personal AI Agent that Katie is building"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[mcp]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "rich>=15.0.0",
    "uuid>=1.30",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
